$('safe').addEventListener('input',function(e){var d=e.target.dataset;if(d.r!==undefined){bset(+d.r,+d.c,e.target.textContent);if($('xl-edit'))$('xl-edit').value=e.target.textContent}});
$('safe').addEventListener('focusin',function(e){var d=e.target.dataset;if(d.r!==undefined)bselect(+d.r,+d.c,false)});
$('safe').addEventListener('keydown',function(e){if(e.target.dataset.r!==undefined&&e.key==='Enter'){e.preventDefault();bselect(Math.min(65,+e.target.dataset.r+1),+e.target.dataset.c,true)}});
$('safe').addEventListener('change',function(e){if(e.target.id==='xl-edit'){bset(bookCell.r,bookCell.c,e.target.value);var td=$('safe').querySelector('[data-r="'+bookCell.r+'"][data-c="'+bookCell.c+'"]');if(td)td.textContent=e.target.value}});
$('safe').addEventListener('click',function(e){var z=e.target.closest('[data-office]');if(!z)return;var a=z.dataset.office;if(a==='tab'){bookTab=+z.dataset.i;bookCell={r:7,c:2};safeView()}if(a==='prev'){bookTab=(bookTab+2)%3;safeView()}if(a==='csv')officeCsv();if(a==='add'){book[bookTab].push(Array(10).fill(''));bookSave();safeView()}if(a==='sort'){book[bookTab].sort(function(a,b){return String(a[2]||'').localeCompare(String(b[2]||''),'ko')});bookSave();safeView()}if(a==='focus'){var td=$('safe').querySelector('td.current');if(td)td.focus()}});

$('switch').onclick=function(){hide(!p.active)};$('gameTab').onclick=function(){hide(false)};$('safeTab').onclick=function(){hide(true)};
document.addEventListener('keydown',function(e){if(e.code==='Backquote'&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.isComposing){e.preventDefault();hide(!p.active)}});
$('csv').onclick=function(){var text='\uFEFF'+[headings].concat(sheet).map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='프로젝트_현황.csv';a.click()};
$('letters').innerHTML=Array.from({length:14},function(_,i){return '<span>'+String.fromCharCode(65+i)+'</span>'}).join('');
setInterval(function(){if(s.phase==='classic'&&s.deadline){var n=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if($('timer'))$('timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(p.host&&n===0)next()}},500);home();
})();
</script></body></html>
