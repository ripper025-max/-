argin:13px 0}.muted{color:#798693;font-size:12px}.gap{height:12px}.chip{display:inline-block;background:#eaf5ef;color:#236a44;border:1px solid #d2e5d8;padding:6px 10px}.members{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:15px 0}.members div{padding:12px;border:1px solid #dce6e9;background:#f9fbfa}.board{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px}.art{border:1px solid #cdd9df;padding:6px}canvas{display:block;width:100%;height:auto;touch-action:none;background:white}.palette{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0;align-items:center}.palette button.color{width:25px;height:25px;border:1px solid #a7b9c4;padding:0}.palette button.sel{outline:2px solid #187c4b;outline-offset:2px}.chat{height:220px;overflow-y:auto;border:1px solid #dae4e8;padding:9px;background:white}.chat p{border-bottom:1px solid #eef1f3;padding:4px 0;margin:0}.score{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.score span{padding:9px;background:#f5f9f6;border:1px solid #dce9df}.hidden{display:none!important}.safe table{border-collapse:collapse;min-width:850px;width:100%}.safe td,.safe th{border:1px solid #d9e4e7;padding:9px;text-align:left}.safe th{background:#e9f3ed}.bottom{background:#f9fafb;border-top:1px solid #e0e6e9;padding:7px 15px}.bottom button{background:none;border:0;padding:7px 15px}.bottom .active{background:white;border-bottom:2px solid #187c4b;font-weight:bold}.steps>div{border-bottom:1px solid #e3e9eb;padding:12px 0}.steps canvas{max-width:400px;border:1px solid #d5e1e7}.big{font-size:25px;font-weight:bold}@media(max-width:720px){.flex,.board{display:block}.flex>*{margin-bottom:12px}.main{padding:8px}.body{padding:12px}.ribbon span:nth-child(2),.ribbon span:nth-child(3){display:none}}
</style></head><body><header class="bar"><b>▣　프로젝트 운영 현황 · 통합 업무표</b><button id="switch">업무 화면 [ &#96; ]</button></header><div class="tabs"><b>홈</b><span>삽입</span><span>데이터</span><span>검토</span><span>보기</span></div><div class="ribbon"><span>클립보드<br><small>붙여넣기 / 복사</small></span><span>글꼴<br><small>맑은 고딕 · 11</small></span><span>맞춤<br><small>텍스트 / 정렬</small></span><button class="btn" id="csv">CSV 내보내기</button></div><div class="formula"><b>B4</b><b>fx</b><input id="formula" placeholder="셀 입력"></div><div id="letters" class="letters"></div><div class="main"><div id="game" class="sheet"></div><div id="safe" class="sheet safe hidden"></div></div><div class="bottom"><button id="gameTab" class="active">운영 데이터</button><button id="safeTab">프로젝트 현황</button><span class="muted" id="status">준비</span></div>
<script>
(function(){
var $=function(id){return document.getElementById(id)},x=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var words=['고양이','아이스크림','공룡','전시부스','치킨','비행기','축구공','핸드폰','수박','악어','자전거','우주선','라면','해바라기','로봇','강아지','선풍기','소방차','냉장고','피자','펭귄','햄버거','지하철','신호등','카메라','공룡','오징어','마술사'];
var colors=['#202832','#ee5252','#f39a3b','#eec340','#3eab6b','#289faa','#397cca','#8556be','#ac7451','#ffffff'];
var p={id:'',peer:null,conn:null,links:{},host:false,code:'',name:'',mode:'classic',active:false,word:'',task:null,draw:[],color:colors[0],size:5,press:false,prev:null,album:0,turn:-1},s={phase:'home',mode:'classic',players:[],turn:0,drawer:'',deadline:0,strokes:[],chat:[],guessed:{},albums:[],step:0,done:{}};
var headings=['번호','구분','프로젝트명','담당','시작일','종료일','진행률','예산','비고'];
var seeded=[['01','전시','기업 홍보관 조성','설계팀','2026-11-09','2026-11-18','70%','12500000','출력 검수'],['02','행사','산업박람회 부스','제작팀','2026-11-11','2026-11-20','45%','8600000','구조제작'],['03','디자인','브랜드 쇼룸 수정','디자인팀','2026-11-12','2026-11-25','25%','15300000','시안 수정']];
var sheet;try{sheet=JSON.parse(localStorage.getItem('sheetparty-sheet'));if(!Array.isArray(sheet))throw 1}catch(e){sheet=Array.from({length:22},function(_,i){return seeded[i]||[i+1,'','','','','','','','']})}
function status(t){$('status').textContent=t}
function safeView(){$('safe').innerHTML='<div class="sh"><h2>2026 프로젝트 운영 현황</h2><small>내부 업무 자료 · 편집 가능</small></div><div class="body" style="overflow:auto"><table><thead><tr>'+headings.map(function(h){return '<th>'+x(h)+'</th>'}).join('')+'</tr></thead><tbody>'+sheet.map(function(r,i){return '<tr>'+r.map(function(v,j){return '<td contenteditable="true" data-r="'+i+'" data-c="'+j+'">'+x(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function hide(v){p.active=v;$('game').classList.toggle('hidden',v);$('safe').classList.toggle('hidden',!v);$('gameTab').classList.toggle('active',!v);$('safeTab').classList.toggle('active',v);$('switch').textContent=v?'작업 복귀 [ Backquote ]':'업무 화면 [ Backquote ]';if(v)safeView();else render()}
function send(id,m){if(id===p.id){recv(m);return}var c=p.links[id];if(c&&c.open)c.send(m)}
function all(m){s.players.forEach(function(z){send(z.id,m)})}
function sync(){all({t:'state',s:JSON.parse(JSON.stringify(s))})}
function task(id){var n=s.players.length,i=s.players.findIndex(function(z){return z.id===id}),ai=(i-s.step+n)%n,a=s.albums[ai];send(id,{t:'task',step:s.step,kind:s.step%2?'draw':'text',source:a.length?a[a.length-1]:null,done:!!s.done[id]})}
function nextStage(){s.done={};sync();s.players.forEach(function(z){task(z.id)})}
function classic(){s.phase='classic';s.drawer=s.players[s.turn].id;s.strokes=[];s.guessed={};s.deadline=Date.now()+75000;s.chat=[{n:'시스템',v:'그림 보고 정답을 맞히세요'}];p.word=words[Math.floor(Math.random()*words.length)];s.players.forEach(function(z){send(z.id,{t:'word',v:z.id===s.drawer?p.word:''})});sync()}
function next(){if(s.phase!=='classic')return;s.turn++;if(s.turn>=s.players.length){s.phase='end';sync()}else classic()}
function start(){if(s.players.length<2)return;s.turn=0;s.players.forEach(function(z){z.score=0});if(s.mode==='classic')classic();else{s.phase='relay';s.step=0;s.albums=s.players.map(function(){return []});nextStage()}}
function host(id,m){if(m.t==='hello'){if(s.phase!=='lobby'||s.players.length>=8){send(id,{t:'error',v:'방에 입장할 수 없습니다'});return}if(s.players.some(function(z){return z.id===id}))return;s.players.push({id:id,name:String(m.name).slice(0,14),score:0});sync();return}if(!s.players.some(function(z){return z.id===id}))return;
if(m.t==='mode'&&s.phase==='lobby'){s.mode=m.v;sync()}
if(m.t==='start'&&s.phase==='lobby')start();
if(m.t==='reset'&&['end','results'].includes(s.phase)){s.phase='lobby';s.turn=0;sync()}
if(m.t==='stroke'&&s.phase==='classic'&&id===s.drawer){if(s.strokes.length<6000){s.strokes.push(m.v);all({t:'stroke',v:m.v})}}
if(m.t==='clear'&&s.phase==='classic'&&id===s.drawer){s.strokes=[];all({t:'clear'})}
if(m.t==='guess'&&s.phase==='classic'&&id!==s.drawer&&!s.guessed[id]){var g=String(m.v||'').trim().slice(0,40),z=s.players.find(function(a){return a.id===id});if(!g)return;if(g.replace(/\s/g,'')===p.word.replace(/\s/g,'')){s.guessed[id]=true;z.score+=Math.max(50,Math.floor((s.deadline-Date.now())/1000)*10);s.chat.push({n:'시스템',v:z.name+' 정답!'});if(s.players.every(function(q){return q.id===s.drawer||s.guessed[q.id]}))s.deadline=Date.now()+1800}else s.chat.push({n:z.name,v:g});sync()}
if(m.t==='submit'&&s.phase==='relay'&&m.step===s.step&&!s.done[id]){var n=s.players.length,i=s.players.findIndex(function(z){return z.id===id}),ai=(i-s.step+n)%n,kind=s.step%2?'draw':'text';if(kind==='text'){var val=String(m.v||'').trim().slice(0,100);if(!val)return;s.albums[ai].push({kind:kind,v:val,by:s.players[i].name})}else{if(!Array.isArray(m.v)||!m.v.length)return;s.albums[ai].push({kind:kind,v:m.v.slice(0,5000),by:s.players[i].name})}s.done[id]=true;send(id,{t:'task',done:true,step:s.step,kind:kind});if(Object.keys(s.done).length===n){if(s.step===n-1){s.phase='results';sync()}else{s.step++;nextStage()}}else sync()}}
function toHost(m){if(p.host)host(p.id,m);else if(p.conn&&p.conn.open)p.conn.send(m);else status('연결을 확인하세요')}
function recv(m){if(m.t==='state'){var last=p.turn;s=m.s;p.turn=s.turn;if(s.phase==='classic'&&last!==p.turn)p.draw=[];render()}if(m.t==='word'){p.word=m.v;render()}if(m.t==='task'){if(!p.task||p.task.step!==m.step)p.draw=[];p.task=m;render()}if(m.t==='stroke'&&s.phase==='classic'&&p.id!==s.drawer){p.draw.push(m.v);drawLine(m.v)}if(m.t==='clear'){p.draw=[];clearCanvas()}if(m.t==='error'){status(m.v)}}
function attach(c){p.links[c.peer]=c;c.on('data',function(m){if(p.host)host(c.peer,m);else recv(m)});c.on('close',function(){if(p.host&&s.phase==='lobby'){s.players=s.players.filter(function(z){return z.id!==c.peer});sync()}else status('연결 끊김')})}
function connect(create){if(typeof Peer==='undefined'){status('실시간 연결 서비스가 차단되었습니다');return}p.name=($('name')?$('name').value:'').trim().slice(0,14);if(!p.name){status('이름을 입력하세요');return}localStorage.setItem('sheetparty-nick',p.name);p.code=create?Math.random().toString(36).slice(2,8).toUpperCase():($('room')?$('room').value:'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(p.code)){status('6자리 방 코드를 입력하세요');return}p.host=create;p.peer=new Peer(create?'sheetparty-v26-'+p.code:undefined);status('연결 중...');p.peer.on('open',function(id){p.id=id;if(create){s={phase:'lobby',mode:p.mode,players:[{id:id,name:p.name,score:0}],turn:0,drawer:'',deadline:0,strokes:[],chat:[],guessed:{},albums:[],step:0,done:{}};render();status('방 생성 완료')}else{p.conn=p.peer.connect('sheetparty-v26-'+p.code);p.conn.on('open',function(){attach(p.conn);p.conn.send({t:'hello',name:p.name})});p.conn.on('error',function(){status('방 연결 실패')})}});p.peer.on('connection',function(c){if(p.host)attach(c);else c.close()});p.peer.on('error',function(e){status('실시간 연결 오류: '+e.type)})}
function view(title,subtitle,body){$('game').innerHTML='<div class="sh"><h2>'+title+'</h2><small>'+subtitle+'</small></div><div class="body">'+body+'</div>'}
function home(){view('공동 작업 공간','그림 맞히기 · 그림 릴레이','<div class="flex"><div class="card"><h3>01. 그림 맞히기</h3><p>한 명이 그림을 그리고 다른 사람이 채팅으로 정답을 맞힙니다.</p><h3>02. 그림 릴레이</h3><p>문장과 그림을 번갈아 전달하고 마지막에 전 과정을 공개합니다.</p><div class="note">Backquote 키를 누르면 즉시 업무용 표로 전환됩니다.</div></div><div class="card"><h3>방 만들기 / 참가하기</h3><input id="name" class="field" placeholder="참가자 이름" maxlength="14" value="'+x(localStorage.getItem('sheetparty-nick')||'')+'"><div class="gap"></div><button class="btn '+(p.mode==='classic'?'on':'')+'" data-a="pick" data-v="classic">그림 맞히기</button> <button class="btn '+(p.mode==='relay'?'on':'')+'" data-a="pick" data-v="relay">그림 릴레이</button><div class="gap"></div><button class="btn primary" style="width:100%" data-a="create">새 방 만들기</button><div class="gap"></div><div class="row"><input class="field" maxlength="6" id="room" placeholder="6자리 방 코드"><button class="btn" data-a="join">입장</button></div><p>회원가입 및 별도 프로그램 설치 없이 시작할 수 있습니다.</p></div></div>')}
function lobby(){view('공동 작업 대기실','방 코드 '+p.code+' · '+s.players.length+'명','<div class="flex"><div class="card"><h3>초대 코드</h3><div class="big">'+p.code+'</div><div class="gap"></div><button class="btn" data-a="copy">링크와 코드 복사</button><p>방장은 플레이 중에도 이 창을 유지해야 합니다.</p></div><div class="card"><h3>게임 선택</h3><button class="btn '+(s.mode==='classic'?'on':'')+'" data-a="mode" data-v="classic" '+(!p.host?'disabled':'')+'>그림 맞히기</button> <button class="btn '+(s.mode==='relay'?'on':'')+'" data-a="mode" data-v="relay" '+(!p.host?'disabled':'')+'>그림 릴레이</button></div></div><div class="members">'+s.players.map(function(z){return '<div>'+x(z.name)+'</div>'}).join('')+'</div>'+(p.host?'<button class="btn primary" data-a="start" '+(s.players.length<2?'disabled':'')+'>게임 시작 ('+s.players.length+'명)</button>':'<div class="note">방장이 시작하기를 기다리고 있습니다.</div>'))}
function palette(){return '<div class="palette">'+colors.map(function(c){return '<button class="color '+(p.color===c?'sel':'')+'" style="background:'+c+'" data-a="color" data-v="'+c+'"></button>'}).join('')+'<label>굵기 <input type="range" min="2" max="20" value="'+p.size+'" id="size"></label><button class="btn" data-a="clear">지우기</button></div>'}
function canvas(edit){return '<div class="art"><canvas id="art" width="700" height="410"></canvas></div>'+(edit?palette():'')}
function clearCanvas(){var c=$('art');if(c){var ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,700,410)}}
function drawLine(v){var c=$('art');if(!c)return;var q=c.getContext('2d');q.beginPath();q.strokeStyle=v.c;q.lineWidth=v.s;q.lineCap='round';q.moveTo(v.a,v.b);q.lineTo(v.d,v.e);q.stroke()}
function redraw(arr){clearCanvas();(arr||[]).forEach(drawLine)}
function enable(){var c=$('art');if(!c)return;var pos=function(e){var r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*410/r.height}};c.onpointerdown=function(e){e.preventDefault();c.setPointerCapture(e.pointerId);p.press=true;p.prev=pos(e);line(p.prev,p.prev)};c.onpointermove=function(e){if(!p.press)return;e.preventDefault();var t=pos(e);line(p.prev,t);p.prev=t};c.onpointerup=c.onpointercancel=function(){p.press=false}}
function line(a,b){if(p.draw.length>=5000)return;var v={a:Math.round(a.x),b:Math.round(a.y),d:Math.round(b.x),e:Math.round(b.y),c:p.color,s:p.size};p.draw.push(v);drawLine(v);if(s.phase==='classic')toHost({t:'stroke',v:v})}
function classicView(){var drawing=s.drawer===p.id,done=s.guessed[p.id];view('실시간 그림 맞히기',(s.turn+1)+'/'+s.players.length+'차례','<div class="row"><span class="chip">출제자: '+x(s.players.find(function(z){return z.id===s.drawer}).name)+'</span><span class="chip" id="timer">01:15</span></div><div class="gap"></div><div class="board"><div><div class="note">'+(drawing?'제시어: <b>'+x(p.word)+'</b>':done?'정답을 맞혔습니다.':'그림을 보고 맞혀 주세요.')+'</div>'+canvas(drawing)+'<div class="score">'+s.players.map(function(z){return '<span>'+x(z.name)+'　'+z.score+'점</span>'}).join('')+'</div></div><div class="card"><h3>답안</h3><div class="chat" id="chat">'+s.chat.map(function(m){return '<p><b>'+x(m.n)+'</b>　'+x(m.v)+'</p>'}).join('')+'</div><form class="row" id="guessForm"><input class="field" id="guess" placeholder="정답 입력" '+(drawing||done?'disabled':'')+'><button class="btn primary" '+(drawing||done?'disabled':'')+'>확인</button></form></div></div>');redraw(p.host?s.strokes:p.draw);if(drawing)enable()}
function staticArt(c,st){var q=c.getContext('2d');q.fillStyle='#fff';q.fillRect(0,0,700,410);(st||[]).forEach(function(v){q.beginPath();q.lineCap='round';q.lineWidth=v.s;q.strokeStyle=v.c;q.moveTo(v.a,v.b);q.lineTo(v.d,v.e);q.stroke()})}
function relayView(){var t=p.task,done=t&&t.done;view('그림 릴레이','단계 '+(s.step+1)+' / '+s.players.length,'<div class="note">제출 완료 '+Object.keys(s.done).length+' / '+s.players.length+'명</div>'+(t?'<div class="card"><h3>'+(t.kind==='text'?(s.step?'앞사람 그림을 보고 설명하세요':'첫 문장을 작성하세요'):'제시어를 그림으로 표현하세요')+'</h3>'+(t.source?(t.source.kind==='text'?'<h2>'+x(t.source.v)+'</h2>':'<canvas id="source" width="700" height="410" style="max-width:380px;border:1px solid #ddd"></canvas>'):'')+'</div><div class="gap"></div>'+(done?'<div class="note">제출 완료. 다른 사람을 기다려 주세요.</div>':t.kind==='text'?'<textarea class="field" style="height:110px" id="reply" placeholder="문장을 작성하세요"></textarea><div class="gap"></div><button class="btn primary" data-a="submitText">문장 제출</button>':canvas(true)+'<div class="gap"></div><button class="btn primary" data-a="submitDraw">그림 제출</button>'):'작업을 준비 중입니다.'));if(t&&t.source&&t.source.kind==='draw'&&$('source'))staticArt($('source'),t.source.v);if(t&&!done&&t.kind==='draw'){redraw(p.draw);enable()}}
function resultView(){var rel=s.phase==='results',body=rel?'<div class="row">'+s.albums.map(function(_,i){return '<button class="btn '+(p.album===i?'on':'')+'" data-a="album" data-v="'+i+'">릴레이 '+(i+1)+'</button>'}).join('')+'</div><div class="steps">'+(s.albums[p.album]||[]).map(function(item,i){return '<div><span class="muted">'+(i+1)+'단계 · '+x(item.by)+'</span>'+(item.kind==='text'?'<h2>'+x(item.v)+'</h2>':'<canvas class="resultArt" width="700" height="410" data-strokes="'+encodeURIComponent(JSON.stringify(item.v))+'"></canvas>')+'</div>'}).join('')+'</div>':'<div class="score">'+s.players.sort(function(a,b){return b.score-a.score}).map(function(z,i){return '<span>'+(i+1)+'위 · '+x(z.name)+'　'+z.score+'점</span>'}).join('')+'</div>';view(rel?'그림 릴레이 결과':'그림 맞히기 결과','모든 참가자가 완료했습니다',body+(p.host?'<div class="gap"></div><button class="btn primary" data-a="reset">다시 시작</button>':''));document.querySelectorAll('.resultArt').forEach(function(c){staticArt(c,JSON.parse(decodeURIComponent(c.dataset.strokes)))})}
function render(){if(p.active)return;if(s.phase==='home')home();else if(s.phase==='lobby')lobby();else if(s.phase==='classic')classicView();else if(s.phase==='relay')relayView();else resultView()}
$('game').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;if(a==='pick'){if($('name'))localStorage.setItem('sheetparty-nick',$('name').value);p.mode=v;home()}if(a==='create')connect(true);if(a==='join')connect(false);if(a==='mode')toHost({t:'mode',v:v});if(a==='start')toHost({t:'start'});if(a==='reset')toHost({t:'reset'});if(a==='color'){p.color=v;document.querySelectorAll('.color').forEach(function(c){c.classList.toggle('sel',c.dataset.v===v)})}if(a==='clear'){p.draw=[];clearCanvas();if(s.phase==='classic')toHost({t:'clear'})}if(a==='submitText'&&$('reply'))toHost({t:'submit',step:s.step,v:$('reply').value});if(a==='submitDraw'){if(p.draw.length)toHost({t:'submit',step:s.step,v:p.draw.slice()});else status('그림을 그려주세요')}if(a==='album'){p.album=+v;resultView()}if(a==='copy'){var t='게임 링크: '+location.href+'\n방 코드: '+p.code;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){status('링크와 코드 복사됨')});else status(p.code)}});
$('game').addEventListener('input',function(e){if(e.target.id==='size')p.size=+e.target.value});
$('game').addEventListener('submit',function(e){if(e.target.id==='guessForm'){e.preventDefault();if($('guess').value.trim())toHost({t:'guess',v:$('guess').value.trim()});$('guess').value=''}});
$('safe').addEventListener('input',function(e){if(e.target.dataset.r!==undefined){sheet[+e.target.dataset.r][+e.target.dataset.c]=e.target.textContent;localStorage.setItem('sheetparty-sheet',JSON.stringify(sheet))}});
$('switch').onclick=function(){hide(!p.active)};$('gameTab').onclick=function(){hide(false)};$('safeTab').onclick=function(){hide(true)};
document.addEventListener('keydown',function(e){if(e.code==='Backquote'&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.isComposing){e.preventDefault();hide(!p.active)}});
$('csv').onclick=function(){var text='\uFEFF'+[headings].concat(sheet).map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var blob=new Blob([text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='프로젝트_현황.csv';a.click()};
$('letters').innerHTML=Array.from({length:14},function(_,i){return '<span>'+String.fromCharCode(65+i)+'</span>'}).join('');
setInterval(function(){if(s.phase==='classic'&&s.deadline){var n=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if($('timer'))$('timer').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(p.host&&n===0)next()}},500);home();
})();
</script></body></html>
