 if(subTab==='delivery')return pane(`<div class="head"><strong>가게 운영</strong></div>${storeTabHeader()}<div class="helpBox">배달비·수수료는 플랫폼마다 다릅니다. 무료배달 기준을 낮추면 고객 유입이 늘 수 있지만, 가게가 부담하는 배달비도 커집니다. <b>실제 업체 요율이 아닌 게임용 가정치</b>입니다.</div>${PLATFORMS.map(p=>{const a=S.apps[p.id];return `<div class="item"><div><div class="itemTitle">${p.name} ${a.on?'<span class="badgeChange">입점 중</span>':''}</div><div class="itemDesc">중개 ${(p.fee*100).toFixed(1)}% + 결제 ${(p.payFee*100).toFixed(1)}% · 기본 배달운영비 ${fm(p.ship)}</div></div>${!a.on?`<button class="tinyBtn buy" onclick="platformToggle('${p.id}')">입점 ${fm(p.setup)}</button>`:''}</div>${a.on?`<div class="config"><label>고객 배달비</label><select onchange="setPlatform('${p.id}','delivery',this.value)">${[0,1000,1500,1900,2500].map(n=>`<option value="${n}" ${a.delivery===n?'selected':''}>${fm(n)}</option>`).join('')}</select><label>무료배달 기준</label><select onchange="setPlatform('${p.id}','free',this.value)">${[15000,20000,23000,30000].map(n=>`<option value="${n}" ${a.free===n?'selected':''}>${fm(n)}</option>`).join('')}</select><label>가게 쿠폰</label><select onchange="setPlatform('${p.id}','coupon',this.value)">${[0,1000,2000].map(n=>`<option value="${n}" ${a.coupon===n?'selected':''}>${fm(n)}</option>`).join('')}</select></div>`:''}`}).join('')}<div class="note">가게 배달 부담액 = 기본 배달 운영비 − 고객이 낸 배달비. 쿠폰은 별도 차감됩니다. 이 계산은 경영 학습을 위한 단순화 모델입니다.</div>`)}
 if(tab==='record'){if(recTab==='report'){const h=S.lastReport;return pane(`<div class="head"><strong>기록 · 쉬운 정산</strong></div>${recordTabs()}${h?`<div class="summary"><div>오늘 매출<strong>${fm(h.sales)}</strong></div><div>실제 남은 돈<strong style="color:${h.profit<0?'#b44d40':'#276e56'}">${fm(h.profit)}</strong></div><div>완료 주문<strong>${h.served}건</strong></div></div><div class="helpBox">${h.profit>=0?'오늘 장사는 흑자입니다.':'오늘은 적자입니다. 주문 수와 배달비, 고정비를 확인하세요.'}</div><div class="item"><div class="itemTitle">재료비</div><b>${fm(h.foodCost)}</b></div><div class="item"><div class="itemTitle">배달 수수료·배달비</div><b>${fm(h.fee)}</b></div><div class="item"><div class="itemTitle">쿠폰·긴급 조리</div><b>${fm(h.coupon)}</b></div><div class="item"><div class="itemTitle">인건비·임대료</div><b>${fm(h.labor+h.rent)}</b></div>`:'<div class="empty">첫날 영업을 마치면 매출과 실제 남은 돈을 알려드립니다.</div>'}<div class="item"><button class="tinyBtn" onclick="saveExport()">저장 백업 내보내기</button><label class="tinyBtn" style="cursor:pointer">백업 가져오기<input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0]);this.value=''" /></label><button class="tinyBtn danger" onclick="confirmReset()">초기화</button></div>`)}else return pane(`<div class="head"><strong>기록 · 손님 리뷰</strong></div>${recordTabs()}<div class="revs">${S.reviews.length?S.reviews.slice(0,20).map((v,i)=>`<div class="review"><div class="revTop"><b>${v.nick}</b><span>DAY ${v.date} · ${'★'.repeat(v.stars)}${'☆'.repeat(5-v.stars)}</span></div><p>${v.text}</p><div class="row" style="justify-content:space-between;margin-top:6px"><span class="mini">${MENU[v.menu].name} · ${v.type==='hall'?'홀 식사':'배달'}</span><button class="tinyBtn" ${v.answered?'disabled':''} onclick="answerReview(${i})">${v.answered?'답글 완료':'답글 남기기'}</button></div></div>`).join(''):'<div class="empty">영업을 진행하면 다양한 닉네임의 리뷰가 쌓입니다.</div>'}</div>`)
 }
}
function storeTabHeader(){return `<div class="subTabs"><button class="${subTab==='menu'?'active':''}" onclick="subTab='menu';renderPane()">메뉴</button><button class="${subTab==='staff'?'active':''}" onclick="subTab='staff';renderPane()">직원·주방</button><button class="${subTab==='delivery'?'active':''}" onclick="subTab='delivery';renderPane()">배달앱</button></div>`}
function recordTabs(){return `<div class="subTabs"><button class="${recTab==='report'?'active':''}" onclick="recTab='report';renderPane()">쉬운 정산</button><button class="${recTab==='reviews'?'active':''}" onclick="recTab='reviews';renderPane()">손님 리뷰 ${S.reviews.length}</button></div>`}
// Canvas scene — asset-based, not a generic rectangle illustration.
const cvs=$('scene'),ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
function img(k,x,y,w=64,h=64){const im=sprites[k];if(!im?.complete||!im.naturalWidth)return;const b=BBOX[k];if(b && w===64 && h===64){const f=['cafe-table','stove','sink','counter','cafe-chair','fridge','pastry-case'].includes(k)?1.42:1.25;const bw=b[2]-b[0],bh=b[3]-b[1],cx=x+(b[0]+b[2])/2,cy=y+(b[1]+b[3])/2;ctx.drawImage(im,b[0],b[1],bw,bh,Math.round(cx-bw*f/2),Math.round(cy-bh*f/2),Math.round(bw*f),Math.round(bh*f))}else ctx.drawImage(im,Math.round(x),Math.round(y),w,h)}
function tiles(k,x,y,w,h){for(let yy=y;yy<y+h;yy+=32)for(let xx=x;xx<x+w;xx+=32)img(k,xx,yy,32,32)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function pixelLabel(text,x,y){ctx.fillStyle='#254235';ctx.fillRect(x-2,y-12,text.length*8+14,18);ctx.fillStyle='#fff8e1';ctx.font='bold 12px sans-serif';ctx.fillText(text,x+4,y+2)}
function seatCoord(i){return [[92,236],[234,236],[155,292],[258,295]][i]||[92,236]}
function drawStage(){ctx.clearRect(0,0,480,326);rect(0,0,480,326,'#26333b');
 // Kitchen y=7..159, dining / courier y=172..318.
 tiles(S.decor>=2?'slate-tile':'cream-tile',10,23,462,136);
 tiles(S.decor>=1?'oak-floor':'cream-tile',10,173,302,144);
 tiles(S.decor>=2?'slate-tile':'sage-tile',323,173,148,144);
 rect(6,0,468,16,'#364650');rect(6,16,468,5,'#879d8a');
 rect(6,159,200,11,'#35464d');rect(258,159,216,11,'#35464d');rect(206,159,52,8,'#b99063');rect(310,168,11,150,'#35464d');
 rect(0,319,49,7,'#35464d');rect(99,319,327,7,'#35464d');rect(463,319,17,7,'#35464d');
 // Wall decor visibly changes.
 if(S.decor===0){rect(12,5,458,9,'#b8cabe');}
 if(S.decor===1){rect(12,5,458,9,'#658e7b');img('wall-art',360,12);img('plant-large',277,235);img('rug',103,262);}
 if(S.decor>=2){rect(12,5,458,9,'#b98e56');rect(12,12,458,5,'#eedaae');img('wall-art',346,8);img('wall-clock',194,5);img('plant-large',273,245);img('plant-large',7,239);img('rug',120,260);img('floor-lamp',278,178);img('wall-window',45,1);pixelLabel('ORDER TOWN',270,28);}
 // Kitchen gear fixed stations, visual capacity changes.
 img('fridge',315,62);img('sink',232,64);img('stove',60,58);img('stove',122,58);
 if(S.stations>=3)img('stove',178,58);
 if(S.stations>=4)img('stove',20,58);
 img('counter',202,125);img('counter',265,125);img('pastry-case',387,62);if(S.decor>=1){img('wall-clock',147,11);img('plant-small',442,102)}else{img('kitchen-cabinet',375,12);}
 // Dining tables clearly placed. More decoration means more seats.
 for(let i=0;i<2+S.decor;i++){const [x,y]=seatCoord(i);img('cafe-table',x-34,y-38);img('cafe-chair',x-58,y-28);img('cafe-chair',x+12,y-28)}
 if(S.decor>=1){img('sofa',3,244);img('plant-small',286,283)}
 if(S.decor>=2){img('coffee-table',32,207);img('wall-art',15,174);}
 // Pickup has a distinct package counter and rider queue.
 img('counter',344,204);img('parcel-stack',385,212);img('plant-small',439,263);if(S.decor>=2)img('floor-lamp',420,179);
 ctx.fillStyle='#405e56';ctx.fillRect(360,184,83,18);ctx.font='bold 12px sans-serif';ctx.fillStyle='white';ctx.fillText('PICK UP',372,197);
 // Animated patrons and riders at meaningful locations.
 for(const o of activeOrders()){
  if(o.type==='hall'){
   const [tx,ty]=seatCoord(o.seat);const sx=23,sy=303;
   let x=sx+(tx-sx)*o.customerProgress,y=sy+(ty-sy)*o.customerProgress;
   if(o.status==='eating')y=ty-6;
   drawActor('resident',x,y,o.customerProgress<1?'walk':'idle',o.id);
  }else{
   const rx=462,ry=314,tx=408+(o.id%2)*16,ty=252;
   if(o.riderEta<=3.5){const t=o.riderEta<0?1:clamp((3.5-o.riderEta)/3,0,1);drawActor('courier',rx+(tx-rx)*t,ry+(ty-ry)*t,t<1?'walk':'idle',o.id)}
  }
 }
 // Completed customers walk out of the door; riders leave after pickup.
 for(const d of world.departures){let p=clamp(d.time/d.total,0,1);if(d.role==='courier'){drawActor('courier',415+47*p,252+62*p,'walk',d.id)}else{const [sx,sy]=seatCoord(d.seat);drawActor('resident',sx+(75-sx)*p,sy+(316-sy)*p,'walk',d.id)}}
 // Cooks travel between their assigned stove and the pickup counter.

 const used=S.orders.filter(o=>o.status==='cooking');for(let i=0;i<S.staff;i++){
  const job=used.find(o=>o.assigned===i),baseX=[197,233,275][i],stationX=[94,155,208][i];
  let x=baseX,y=131;
  if(job){const prog=job.progress;
   if(prog<.22){const t=prog/.22;x=baseX+(stationX-baseX)*t;}
   else if(prog<.75){x=stationX;}
   else {const t=(prog-.75)/.25;x=stationX+(262-stationX)*t;}
  }
  drawActor('cook',x,y,job?'walk':'idle',i+101);
 }
 // Simple visible meal / pickup marker per active order (not random sparkle).
 for(const o of activeOrders()){
  if(o.status==='eating'){const [x,y]=seatCoord(o.seat);img('food',x-10,y-28,24,24)}
  if(o.status==='ready'||o.status==='pickup'){img('parcel-stack',337+(o.id%2)*22,208,40,40)}
 }
}
function drawActor(role,x,y,motion,id){const key=`${role}_${motion}_${id%4}`;const im=sprites[`${role}_${motion}_${Math.floor(performance.now()/(motion==='walk'?130:650)+id)%4}`]||sprites[`${role}_idle_0`];if(!im?.complete)return;ctx.fillStyle='rgba(26,35,38,.22)';ctx.fillRect(Math.round(x-10),Math.round(y-4),20,4);ctx.drawImage(im,Math.round(x-30),Math.round(y-60),60,72)}
function loop(ts){if(!lastTs)lastTs=ts;let dt=Math.min((ts-lastTs)/1000,.15);lastTs=ts;
 if(S?.phase==='open'&&!S.paused){const td=dt*S.speed;S.clock+=dt*S.speed*1.25;spawnDelay-=td;if(spawnDelay<=0){addOrder();spawnDelay=r(10,19)*(Math.random()<.25?.6:1)*(1-S.decor*.10)*(S.day%6===4?.82:1)}processOrders(td);closeIfDone();}
 else if(S?.phase==='closing'){processOrders(dt*S.speed);closeIfDone()}
 if(S && !S.paused && ['open','closing'].includes(S.phase))world.departures=world.departures.filter(d=>(d.time+=dt*S.speed)<d.total);drawStage();if(S&&ts%850<60){renderHud();renderOrders();persist()}
 requestAnimationFrame(loop)}
$('mainAction').onclick=actionStart;$('pauseAction').onclick=()=>{S.paused=!S.paused;refresh()};$('rushBtn').onclick=rush;document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>gameSpeed(Number(b.dataset.speed)));document.querySelectorAll('.nav [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
hydrate();refresh();requestAnimationFrame(loop);
// QA hooks are read-only except deliberate synthetic test actions.
window.__OT={get:()=>structuredClone(S),runSeconds:(seconds)=>{for(let t=0;t<seconds;t++){if(S.phase==='open'){S.clock+=S.speed*1.25;spawnDelay-=S.speed;if(spawnDelay<=0){addOrder();spawnDelay=14}processOrders(S.speed);closeIfDone()}else if(S.phase==='closing'){processOrders(S.speed);closeIfDone()}}refresh()},spawn:addOrder,finish:()=>{if(S.phase==='open'){S.clock=1200;S.phase='closing'}for(let i=0;i<120;i++){if(S.phase==='closed')break;processOrders(1);closeIfDone()}refresh()}};

// Prevent double-click text selection / smart zoom without disabling ordinary taps.
document.addEventListener('dblclick', function(e){
  if (!e.target.closest('input,textarea,[contenteditable="true"]')) e.preventDefault();
}, {passive:false});
document.addEventListener('selectstart', function(e){
  if (window.matchMedia('(pointer: coarse)').matches && !e.target.closest('input,textarea,[contenteditable="true"]')) e.preventDefault();
}, {passive:false});
</script></body></html>
